<section class="p-4">
    <h3 class="text-center">¿Desea agregar los accesorios recomendados?</h3>
    <div class="flex flex-col gap-4">
        <p-table [value]="options">
            <ng-template #header>
                <tr>
                    <th>Accesorio</th>
                    <th>Precio (USD)</th>
                    <th>Cantidad</th>
                    <th></th>
                </tr>
            </ng-template>
            <ng-template #body let-product>
                <tr>
                    <td>{{ product.description }}</td>
                    <td>
                        <p-inputnumber
                            [disabled]="!product.enabled.value"
                            type="currency"
                            prefix="$ "
                            [(ngModel)]="product.sellingPrice"
                            readonly
                        />
                    </td>
                    <td>
                        <p-inputnumber
                            [disabled]="!product.enabled.value"
                            [(ngModel)]="product.quantity"
                        />
                    </td>
                    <td>
                        <p-checkbox [formControl]="product.enabled" binary>
                        </p-checkbox>
                    </td>
                </tr>
            </ng-template>
        </p-table>
        <div class="self-end">
            <p-button
                label="Cancelar"
                class="mr-4"
                severity="warn"
                (click)="cancel()"
            ></p-button>
            <p-button (click)="addRecommendedAccesories()">Agregar</p-button>
        </div>
    </div>
</section>
