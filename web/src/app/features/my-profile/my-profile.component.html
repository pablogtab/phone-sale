<section class="profile-page">
    <h1>Mi perfil</h1>
    <p class="feature-description">Tu perfil y el saldo de tus cuentas.</p>
    <div class="profile-card">
        <div class="profile-identity">
            <button type="button" class="profile-avatar" aria-label="Cambiar foto de perfil" (click)="changeProfilePicture()">
                @if (user?.profilePicture) { <img [src]="profilePictureUrl" alt="Foto de perfil" /> }
                @else { <icon name="user-circle" size="36" /> }
            </button>
            <div><h2>{{ user?.name }} {{ user?.lastname }}</h2><button type="button" class="photo-action" (click)="changeProfilePicture()">Cambiar foto</button></div>
        </div>
        <div class="profile-balances"><h2>Saldo de cuenta</h2><div class="balance-grid">
            @for (acc of accounts; track acc.currency) { <div class="balance-item"><span>{{ acc.currency }}</span><strong balanceColor [value]="-acc.balance">{{ acc.balance * -1 | currency: '$ ' }}</strong></div> }
        </div></div>
    </div>
</section>
