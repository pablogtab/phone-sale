<section class="p-4 md:px-8 flex flex-col gap-3">


    <div class="flex flex-row justify-between content-center">
        <h1>Usuarios</h1>
        <div class="flex flex-row gap-4 items-center">
            <p-button
                label="Nuevo"
                styleClass="raised primary"
                (onClick)="newUser()"
                *hasPermission="{ permission: 'users', actions: ['write'] }"
            />
        </div>
    </div>

    <p class="feature-description">Usuarios y permisos de tu tienda.</p>
    <search-term></search-term>
    <ng-container *ngIf="users$ | async as users; else elseTpl">
        <div class="flex flex-col rounded-xl overflow-hidden">
            @for (user of users; track $index; let last = $last) {
                <div
                    style="margin-top: 10px"
                    class="pt-4 p-4 bottom-1 border-b bg-white border-background-3 flex flex-row justify-between items-center gap-3 hover:bg-background-2 rounded-lg cursor-pointer transition-colors"
                >
                    <div class="flex flex-row items-center gap-4">
                        <div
                            class="size-12 rounded-lg overflow-hidden bg-background-4 flex items-center justify-center"
                        >
                            @if (user.profilePicture) {
                                <img
                                    [src]="filesUrl + user.profilePicture"
                                    alt="Foto de perfil"
                                    class="w-full h-full object-cover"
                                />
                            } @else {
                                <icon
                                    name="user-circle"
                                    size="24"
                                    class="text-text-gray-100 text-4xl"
                                ></icon>
                            }
                        </div>
                    </div>
                    <div class="flex-1 flex flex-col">
                        <span class="font-bold"
                            >{{ user.name | titlecase }}
                            {{ user.lastname | titlecase }}</span
                        >
                        <div class="flex justify-between items-center">
                            <p style="color: rgb(166, 166, 166)">
                                {{ user.role | titlecase }}
                            </p>
                            <p
                                class="text-sm"
                                style="color: rgb(166, 166, 166)"
                            >
                                {{ user.createdAt | date: "dd/MM HH:mm" }}
                            </p>
                        </div>
                    </div>

                    <button
                        [cdkMenuTriggerFor]="menu2"
                        (click)="$event.stopPropagation()"
                        class="flex items-center relative"
                    >
                        <icon name="more-vertical"></icon>
                    </button>

                    <ng-template #menu2>
                        <div class="menu" cdkMenu>
                            <button
                                class="menu-item"
                                cdkMenuItem
                                (click)="editUser(user)"
                            >
                                Editar
                            </button>
                            <button class="menu-item" cdkMenuItem>
                                Eliminar
                            </button>
                        </div>
                    </ng-template>
                </div>
            }
        </div>
    </ng-container>
</section>
<ng-template #elseTpl>
    <ng-container *ngIf="loadingUsers">
        <div
            class="d-flex flex-column align-items-center justify-content-center mt-5"
        >
            <h4>Cargando usuarios</h4>
        </div>
    </ng-container></ng-template
>
