<main class="login-page">
  <section class="login-card">
    <h1>{{ store.name() }}</h1>
    <h2>Iniciar sesión</h2>
    <form [formGroup]="form" (ngSubmit)="login()" class="login-form">
            <div class="field">
                <label for="username">Usuario</label
                ><input
                    id="username"
                    formControlName="username"
                    autocomplete="username"
                    placeholder="Tu nombre de usuario"
                    [attr.aria-invalid]="
                        form.controls.username.touched &&
                        form.controls.username.invalid
                    "
                />
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <div class="password-field">
                    <input
                        id="password"
                        formControlName="password"
                        [type]="showPassword() ? 'text' : 'password'"
                        autocomplete="current-password"
                        placeholder="Tu contraseña"
                        [attr.aria-invalid]="
                            form.controls.password.touched &&
                            form.controls.password.invalid
                        "
                    /><button
                        type="button"
                        (click)="showPassword.set(!showPassword())"
                        [attr.aria-label]="
                            showPassword()
                                ? 'Ocultar contraseña'
                                : 'Mostrar contraseña'
                        "
                    >
                        <i
                            [class]="
                                showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'
                            "
                            aria-hidden="true"
                        ></i>
                    </button>
                </div>
            </div>
            @if (form.touched && form.invalid) {
                <p class="form-error" role="alert">
                    Completá el usuario y la contraseña.
                </p>
            }
            @if (error()) {
                <p class="form-error" role="alert">{{ error() }}</p>
            }
            <button type="submit" class="login-submit" [disabled]="pending()">
                {{ pending() ? "Ingresando…" : "Ingresar"
                }}<i class="pi pi-arrow-right" aria-hidden="true"></i>
            </button>
    </form>
  </section>
</main>
