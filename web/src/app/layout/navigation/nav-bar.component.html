<a href="#main-content" class="skip-link">Ir al contenido</a>
<header class="mobile-bar">
    <a routerLink="/" class="brand"
        ><span class="brand-name">{{ store.name() }}</span></a
    >
    <button
        type="button"
        (click)="sidenavOpen ? close() : open()"
        [attr.aria-expanded]="sidenavOpen"
        aria-controls="sidebar"
        aria-label="Abrir navegación"
        class="menu-toggle"
    >
        <i class="pi pi-bars" aria-hidden="true"></i>
    </button>
</header>
@if (sidenavOpen) {
    <button
        type="button"
        class="nav-backdrop"
        (click)="close()"
        aria-label="Cerrar navegación"
    ></button>
}
<aside id="sidebar" class="sidebar" [class.is-open]="sidenavOpen">
    <a routerLink="/" class="brand desktop-brand" (click)="close()"
        ><span class="brand-name">{{ store.name() }}</span></a
    >
    <nav aria-label="Navegación principal">
        @for (item of menuOptions; track item.label) {
            @if (item.items) {
                <details class="nav-group">
                    <summary>
                        <icon [name]="item.icon" /><span>{{ item.label }}</span
                        ><i class="pi pi-angle-down" aria-hidden="true"></i>
                    </summary>
                    <div class="subnav">
                        @for (child of item.items; track child.label) {
                            <a
                                [routerLink]="child.route"
                                [queryParams]="child.queryParams"
                                routerLinkActive="active"
                                (click)="close()"
                                >{{ child.label }}</a
                            >
                        }
                    </div>
                </details>
            } @else if (item.route) {
                <a
                    [routerLink]="item.route"
                    [queryParams]="item.queryParams"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: item.route === '/' }"
                    (click)="close()"
                    class="nav-link"
                    ><icon [name]="item.icon" /><span>{{ item.label }}</span></a
                >
            } @else {
                <button
                    type="button"
                    (click)="item.command()"
                    class="nav-link logout"
                >
                    <icon [name]="item.icon" /><span>{{ item.label }}</span>
                </button>
            }
        }
    </nav>

</aside>
