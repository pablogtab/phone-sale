name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phone_sale
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: phone_sale_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phone_sale -d phone_sale_app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3210
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: phone_sale
      DATABASE_PASSWORD: test_password
      DATABASE_NAME: phone_sale_app
      DATABASE_SCHEMA: public
      JWT_SECRET: isolated-ci-test-secret-not-for-deployment
      JWT_EXPIRES_IN: 1h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm run setup
      - run: npm run build
      - run: npm run test:api
      - run: npm run test:web:coverage
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/phone-sale
          if-no-files-found: ignore
